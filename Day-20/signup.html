<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
</head>
<body>
    <script type="module">
        import { navbar } from "./components/navbar.js";
        document.body.innerHTML += navbar();
    </script>

    <h2>Signup</h2>

    <input type="text" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>

    <button id="btn">Signup</button>

    <script type="module">
        import { signupUser } from "./modules/signup.js";
        document.getElementById("btn").addEventListener("click", signupUser);
    </script>
</body>
</html>
