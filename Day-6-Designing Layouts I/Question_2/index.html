<!DOCTYPE html>
<html lang="en">

<head>

    <title>Simple Verticle Box</title>
    <style>
        body{
            font-family: Arial, sans-serif;
        }
        .main-container {
            width: 400px;

            margin: auto;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }

        .container {
            width: 250px;

            padding: 10px;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        }
        h3{
            color: gray;
        }
        h2{
            color: darkblue;
        }
    </style>
</head>

</html>
