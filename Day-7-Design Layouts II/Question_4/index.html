<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 300px);
            gap: 20px;
            width: 1300px;
            margin: auto;
        }

        .box {
            height: 400px;
            box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 2px sloid darkblue;
            padding-bottom: 10px;
        }

        .image {
            width: 100%;
            border-radius: 10px 10px 0 0;
        }

        p {
            font-size: 18px;
            margin: 8px 0 0 0;
        }

        .logo {
            margin-top: 2px 0;
            width: 150px;
            margin-top: 20px 0 0 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <img class="image" src="https://cdn.masaischool.com/masai-website/Vijay_Shekhar_Sharma_Paytm_96f52579b8.jpg"
                alt="">
